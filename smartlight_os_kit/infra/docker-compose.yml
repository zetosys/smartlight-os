services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: smartlight
      POSTGRES_USER: smartlight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    # Supply an authenticated mosquitto.conf before enabling broker for external access.
volumes:
  pgdata:
